[project]
name = "primitive-db-karpenko-26-555"
version = "0.2.0"
description = "A simple database with CRUD implementation."
readme = "README.md"
authors = [
    { name = "karpenko", email = "ksnikko27@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[tool.uv.build-backend]
module-name = "primitive_db"

[project.scripts]
project = "primitive_db.main:main" 
database = "primitive_db.main:main" 

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [] 

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
